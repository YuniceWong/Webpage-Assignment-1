    <script>

const params = new URLSearchParams(window.location.search);

const color = params.get("color");

}

if(color === "dark-grey"){
  document.getElementById("mainImage").src = "img/pants-2.png";

  document.getElementById("mainImage").src = "img/pants-1.png";
}

</script>
