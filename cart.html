<script>

/* PRODUCT 1 */
let count1 = 1;
let price1 = 8000;

let qty1 =
document.getElementById("qty1");

let plus1 =
document.getElementById("plus1");

let minus1 =
document.getElementById("minus1");

let remove1 =
document.getElementById("remove1");

let card1 =
document.querySelectorAll(".cart-card")[0];



/* PRODUCT 2 */
let count2 = 1;
let price2 = 8000;

let qty2 =
document.getElementById("qty2");

let plus2 =
document.getElementById("plus2");

let minus2 =
document.getElementById("minus2");

let remove2 =
document.getElementById("remove2");

let card2 =
document.querySelectorAll(".cart-card")[1];

/* TOTAL */
let total =
document.getElementById("total");

/* UPDATE */
function update() {
qty1.textContent =
count1;
qty2.textContent =
count2;

let grandTotal =
(count1 * price1)
+
(count2 * price2);

total.textContent =
grandTotal.toLocaleString();
}

/* PRODUCT 1 COUNT */
plus1.onclick =
function(){
count1++;
update();
}

minus1.onclick =
function(){
if(count1 > 1){
count1--;
update();
}
}


/* PRODUCT 2 COUNT */
plus2.onclick =
function(){
count2++;
update();
}

minus2.onclick =
function(){
if(count2 > 1){
count2--;
update();
}
}


/* REMOVE PRODUCT 1 */
remove1.onclick =
function(){
count1 = 0;
card1.style.display =
"none";
update();
}


/* REMOVE PRODUCT 2 */
remove2.onclick =
function(){
count2 = 0;
card2.style.display =
"none";
update();
}

/* INITIAL */
update();
</script>
